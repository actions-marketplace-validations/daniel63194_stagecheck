name: Bug report
description: Something in the CLI, the GitHub Action or the library does not work as documented.
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: stagecheck version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js and npm versions, and OS
      placeholder: Node 24.15.0, npm 12.2.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What you ran
      description: The command or workflow step, and its full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
